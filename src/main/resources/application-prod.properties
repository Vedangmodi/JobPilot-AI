spring.application.name=jobpilot-ai

# Render passes PORT so the JVM listens where the proxy expects.
server.port=${PORT:8080}

# Set APP_CORS_ALLOWED_ORIGINS on Render (comma-separated, no spaces unless intentional).

# Prefer a proper JDBC URL when provided; otherwise adapt Render's DATABASE_URL.
spring.datasource.url=${SPRING_DATASOURCE_URL:${JDBC_DATABASE_URL:jdbc:${DATABASE_URL}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD}}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.data.web.pageable.default-page-size=10

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile